name: CI

on:
  pull_request:
  push:
    branches: [master]
  # build.gradle resolves RuneLite as 'latest.release' (as Plugin Hub does), so a
  # RuneLite release can break the build without any change here. A weekly run on
  # master surfaces that early.
  schedule:
    - cron: '0 6 * * 1'

# Cancel superseded runs of the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # RuneLite Plugin Hub builds with JDK 11 (build.gradle targets release 11).
      - name: Set up JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '11'

      # Validates the Gradle wrapper and caches Gradle/dependency downloads.
      # The cache is only written from master; PR runs read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14
